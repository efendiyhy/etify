name: Android APK

# Builds the phone app's release APKs (one per ABI plus a universal one) and
# uploads them as the run's artifact "etify-android-apk".
#
# Signing: with the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD the APKs are signed with your release key, so
# each build installs over the last. Without them the run makes a one-off key
# for this build only: the APK installs, but the next build's cannot update it
# in place (uninstall first). Add the secrets to make updates work.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '**.md'
      - '.github/workflows/web.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
          } > local.properties

      - name: Signing key (release key from secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > etify-release.jks
          {
            echo "storeFile=etify-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Signing key (one-off, no secrets set)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -keystore etify-release.jks -alias etify \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Etify CI"
          {
            echo "storeFile=etify-release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=etify"
            echo "keyPassword=$PASS"
          } > keystore.properties
          echo "::warning::No KEYSTORE_BASE64 secret: this APK is signed with a one-off key. It installs, but the next build cannot update it in place. Add the signing secrets (see README) to fix that."

      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleProdRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: etify-android-apk
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
