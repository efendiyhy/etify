name: Android APK

# Builds the phone app's release APKs (one per ABI plus a universal one) and
# uploads them as the run's artifact "etify-android-apk".
#
# Signing: with the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD the APKs are signed with your release key, so
# each build installs over the last. Without them the run makes a one-off key
# for this build only: the APK installs, but the next build's cannot update it
# in place (uninstall first). Add the secrets to make updates work.
#
# Releasing: run this workflow by hand with "release" ticked, or push a tag
# like v1.9.2. The APKs are then published as a GitHub Release tagged with the
# app's versionName (build.gradle.kts), named the way the app's own update
# check looks for them: Etify-v1.9.2.apk (universal) and Etify-v1.9.2_<abi>.apk.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '**.md'
      - '.github/workflows/web.yml'
      - '.github/workflows/deploy-web.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the APKs as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
          } > local.properties

      - name: Signing key (release key from secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > etify-release.jks
          {
            echo "storeFile=etify-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Signing key (one-off, no secrets set)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -keystore etify-release.jks -alias etify \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Etify CI"
          {
            echo "storeFile=etify-release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=etify"
            echo "keyPassword=$PASS"
          } > keystore.properties
          echo "::warning::No KEYSTORE_BASE64 secret: this APK is signed with a one-off key. It installs, but the next build cannot update it in place. Add the signing secrets (see README) to fix that."

      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleProdRelease

      - name: Name the APKs
        id: apks
        run: |
          VERSION=$(sed -n 's/^extra\["etifyVersionName"\] = "\(.*\)"$/\1/p' build.gradle.kts)
          [ -n "$VERSION" ] || { echo "::error::No etifyVersionName in build.gradle.kts"; exit 1; }
          mkdir -p dist
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^app-prod-//' -e 's/-release$//')
            if [ "$abi" = "universal" ] || [ "$abi" = "app-prod-release" ] || [ -z "$abi" ]; then
              cp "$apk" "dist/Etify-v$VERSION.apk"
            else
              cp "$apk" "dist/Etify-v${VERSION}_$abi.apk"
            fi
          done
          ls -l dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: etify-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apks.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES="Etify $TAG for Android. Install Etify-$TAG.apk (works on every phone), or the one for your phone's ABI."
          if [ -z "$KEYSTORE_BASE64" ]; then
            NOTES="$NOTES

          Signed with a one-off key: uninstall an earlier Etify before installing this one."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "Etify $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
